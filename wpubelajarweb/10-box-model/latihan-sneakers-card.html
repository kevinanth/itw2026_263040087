<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneakers Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }

        .product-card {
            background-color: #fff;
            margin: 0 auto;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 10px 20px rgba(0, 0, 0 / 0.1);
            width: 320px;
        }

        .product-image {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-category {
            color: #06c;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .product-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }

        .product-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .product-price {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 8px;
        }

        .product-price .price {
            font-size: 26px;
            color: #000;
            font-weight: bold;
        }

        .product-price .original-price {
            font-size: 16px;
            color: #888;
            text-decoration: line-through;
        }

        .size-options-wrapper {
            border: none;
            margin-top: 15px;
        }

        .size-label-text {
            font-size: 13px;
            color: #333;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .size-option {
            margin-bottom: 25px;
        }

        .size-option input[type="radio"] {
            display: none;
        }

        .size-option label {
            display: inline-block;
            width: 48px;
            height: 48px;
            border: 2px solid #ccc;
            text-align: center;
            line-height: 40px;
            color: #333;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s ease;
        }

        .size-option input[type="radio"]:checked + label {
            background-color: #06c;
            color: #fff;
            border-color: #06c;
        }

        .buy-button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #06c;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .buy-button:hover {
            background-color: #005bb5;
        }
    </style>
</head>

<body>
    <article class="product-card">
        <figure class="product-image">
            <img src="https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?q=80&w=928&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Nike Sneakers">
        </figure>

        <p class="product-category">Nike Sportswear</p>
        <h3 class="product-title">Nike SuperRep Go Volt</h3>

        <p class="product-description">The Nike SuperRep Go Volt is designed for high-intensity workouts, providing comfort and support with its lightweight construction and responsive cushioning.</p>

        <div class="product-price">
            <span class="price">$120.00</span>
            <del class="original-price">$150.00</del>
        </div>

        <form action="">
        <fieldset class="size-options-wrapper">
            <legend class="size-label-text">Choose your size</legend>
            <div class="size-option">
                <input type="radio" id="size-7" name="size" value="7">
                <label for="size-7">US 7</label>

                <input type="radio" id="size-8" name="size" value="8">
                <label for="size-8">US 8</label>

                <input type="radio" id="size-9" name="size" value="9">
                <label for="size-9">US 9</label>

                <input type="radio" id="size-10" name="size" value="10">
                <label for="size-10">US 10</label>

                <input type="radio" id="size-11" name="size" value="11">
                <label for="size-11">US 11</label>
            </div>
        </fieldset>

        <button class="buy-button">Add to Cart</button>
        </form>
    </article>
</body>

</html>
