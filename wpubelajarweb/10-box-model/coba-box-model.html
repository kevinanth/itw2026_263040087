<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Box Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: #7eaf8a;
            /* margin-top: 50px;
            margin-left: 40px;
            margin-right: 30px;
            margin-bottom: 20px; */
            /* margin: 50px; ke-4 sisi 50px */
            /* margin: 50px auto; ke-atas dan ke-bawah 50px, ke-kiri dan ke-kanan auto */
            /* margin: 50px, auto, 100px; atas 50px, kanan auto, bawah 100px, kiri auto */
            margin: 10px 20px 30px 40px;
             /* atas, kanan, bawah, kiri searah jarum jam */
            /* padding-top: 50px;
            padding-left: 20px; */
            padding: 50px;

            border: 5px solid #333;
            outline: 5px solid #a73333;
            /* Perbedaannya outline pasti berada di paling depan dan tidak memengaruhi ukuran elemen */

            /* border-top: 10px solid #51cb1d;
            border-left: 10px solid #3d0eea;
            /* Kalo mau cuman kanan kiri aja */

            box-sizing: border-box;
            /* Ukuran elemen termasuk padding dan border */
        }

        .kotak2 {
            width: 200px;
            height: 200px;
            background-color: #7eacaf;
            /* margin-top: 20px; tidak akan ngaruh karena diambilnya nilai paling tinggi yaitu punya kotak1 */
            /* margin-top: -50px; akan keatas dan menimpa kotak1, karena margin-top kotak1 10px dan kotak2 -50px, maka akan diambil nilai paling tinggi yaitu -50px dan defaultnya dia akan menimpa kotak1 karena margin-top kotak2 lebih besar (negatif) dari margin-top kotak1 */
            margin-top: -50px;
        }
    </style>
</head>

<body>
    <div class="kotak1">1</div>
    <div class="kotak2">2</div>
    <!-- Cara hitung ukuran elemen:
- Width + padding + border = Total width
- Height + padding + border = Total height
-->
</body> 
</html>
