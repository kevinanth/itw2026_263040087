<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>
<body>
    <h1>Coba elemen-elemen form pada HTML</h1>

    <form>
        <table cellpadding="4">
            <tr>
                <td align="right"><label for="nama">Nama:</label></td>
                <td><input type="text" id="nama" name="nama" id="nama" placeholder="Masukkan nama Anda"></td>
            </tr>
            <tr>
                <td align="right"><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="password" placeholder="Masukkan password Anda"></td>
            </tr>
            <tr>
                <td align="right"><label for="email">Email:</label></td>
                <td><input type="email" id="email" name="email" placeholder="Masukkan email Anda"></td>
            </tr>
            <tr>
                <td align="right"><label for="angka">Angka:</label></td>
                <td><input type="number" id="angka" name="angka" placeholder="Masukkan angka" min="1" max="100" step="5"></td>
            </tr>
            <tr>
                <td><label for="tanggal">Tanggal:</label></td>
                <td><input type="date" id="tanggal" name="tanggal"></td>
            </tr>
            <tr>
                <td align="right"><label for="warna">Warna:</label></td>
                <td><input type="color" id="warna" name="warna"></td>
            </tr>
            <tr>
                <td colspan="2"><button type="submit">Submit</button></td>
            </tr>
        </table>

    </form>
</body>
</html>
