<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoh Input Atribut, Checkbox & Radio</title>
</head>
<body>
  <h1>Contoh Input Atribut, Checkbox & Radio</h1>

  <form>
    <label for="name">Nama:
    <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" autocomplete="off" autofocus required>
    </label>
    <br>

    <h3>Hobby</h3>
    <label for="hobby1">
      <input type="checkbox" id="hobby1" name="hobby" value="Olahraga"> Olahraga
    </label>
    <br>

    <label for="hobby2">
      <input type="checkbox" id="hobby2" name="hobby" value="Ngoding"> Ngoding
    </label>
    <br>

    <h3>Jenis Kelamin</h3>
    <label for="gender1">
      <input type="radio" id="gender1" name="gender" value="Laki-laki"> Laki-laki
    </label>
    <br>
    <label for="gender2">
      <input type="radio" id="gender2" name="gender" value="Perempuan"> Perempuan
    </label>
    
    <br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
