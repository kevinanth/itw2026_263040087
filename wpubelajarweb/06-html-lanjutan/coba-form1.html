<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>
<body>
    <h1>Coba elemen-elemen form pada HTML</h1>

    <form>
        <label for="nama">Nama:
        <input type="text" id="nama" name="nama" id="nama" placeholder="Masukkan nama Anda">
        </label>
        <br>

        <label for="password">Password:
            <input type="password" id="password" name="password" placeholder="Masukkan password Anda">
        </label>
        <br>

        <label for="email">Email:
            <input type="email" id="email" name="email" placeholder="Masukkan email Anda">
        </label>
        <br>

        <label for="angka">Angka:
            <input type="number" id="angka" name="angka" placeholder="Masukkan angka" min="1" max="100" step="5">
        </label>
        <br>

        <label for="tanggal">Tanggal:
            <input type="date" id="tanggal" name="tanggal">
        </label>
        <br>

        <label for="warna">Warna:
            <input type="color" id="warna" name="warna">
        </label>
        <br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
